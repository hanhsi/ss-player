<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super Star Level 1 — Unit 2 Unit Test 重考練習</title>
  <style>
    /* =========================================================
       Design Tokens & Base Styles (Self-contained, Zero CDN)
    ========================================================= */
    :root {
      --bg-top: #ecfdf5;
      --bg-bottom: #fffbeb;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --emerald: #16a34a;
      --emerald-dark: #15803d;
      --emerald-soft: #dcfce7;
      --sky: #0ea5e9;
      --sky-dark: #0284c7;
      --sky-soft: #e0f2fe;
      --yellow: #facc15;
      --yellow-soft: #fef9c3;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --border: #e2e8f0;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-card: 0 6px 20px rgba(15, 23, 42, 0.06);
      --shadow-btn: 0 4px 0 rgba(0, 0, 0, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background: linear-gradient(180deg, var(--bg-top) 0%, #f7fee7 45%, var(--bg-bottom) 100%);
      min-height: 100vh;
      line-height: 1.5;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      user-select: none;
      touch-action: manipulation;
    }

    /* =========================================================
       Sticky Header
    ========================================================= */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid #d1fae5;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.08);
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--emerald-dark);
      letter-spacing: -0.01em;
    }

    .brand-badge {
      background: var(--emerald);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      background: var(--emerald-soft);
      color: var(--emerald-dark);
      border: 1.5px solid #86efac;
      transition: all 0.25s ease;
    }

    .progress-pill.retry-mode {
      background: #ffedd5;
      color: #c2410c;
      border-color: #fdba74;
    }

    .speed-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      min-height: 36px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      background: var(--sky-soft);
      color: var(--sky-dark);
      border: 1.5px solid #7dd3fc;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .speed-btn:active {
      transform: scale(0.96);
    }

    .speed-btn.slow {
      background: var(--yellow-soft);
      color: #a16207;
      border-color: #fde047;
    }

    /* =========================================================
       Main Container & Intro Banner
    ========================================================= */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    .retry-banner {
      display: none;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 2px solid #fb923c;
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
      color: #9a3412;
      font-weight: 700;
      font-size: 0.95rem;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(251, 146, 60, 0.15);
    }

    .retry-banner.visible {
      display: flex;
    }

    /* =========================================================
       Result Summary Card
    ========================================================= */
    .result-card {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.14);
      border: 3px solid var(--emerald);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-card.visible {
      display: block;
    }

    .result-card.has-errors {
      border-color: var(--amber);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.16);
    }

    .result-emoji {
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .result-score {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--emerald-dark);
      margin: 4px 0;
    }

    .result-card.has-errors .result-score {
      color: var(--amber-dark);
    }

    .result-subtitle {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .result-detail {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      margin: 0 auto;
    }

    .btn-retry-wrong {
      width: 100%;
      min-height: 54px;
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
      box-shadow: 0 4px 0 #c2410c;
      transition: transform 0.12s ease;
    }

    .btn-retry-wrong:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c2410c;
    }

    .btn-restart-all {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--emerald-dark);
      background: var(--emerald-soft);
      border: 2px solid #86efac;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .btn-restart-all:active {
      transform: scale(0.98);
    }

    /* Parent Helper */
    .parent-helper-wrap {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1.5px dashed var(--border);
    }

    .btn-parent-toggle {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      min-height: 38px;
    }

    .btn-parent-toggle:hover {
      background: #f8fafc;
      color: var(--text-main);
    }

    .parent-table-box {
      display: none;
      margin-top: 12px;
      text-align: left;
      overflow-x: auto;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 10px;
    }

    .parent-table-box.open {
      display: block;
    }

    .parent-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .parent-table th,
    .parent-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    .parent-table th {
      color: var(--text-muted);
      font-weight: 700;
      background: #f1f5f9;
      white-space: nowrap;
    }

    .parent-table tr:last-child td {
      border-bottom: none;
    }

    .ans-chip {
      display: inline-block;
      background: var(--emerald-soft);
      color: var(--emerald-dark);
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }

    /* =========================================================
       Section Headers
    ========================================================= */
    .quiz-section {
      margin-bottom: 24px;
    }

    .quiz-section.hidden {
      display: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: linear-gradient(90deg, var(--emerald) 0%, #22c55e 100%);
      color: #fff;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.18);
    }

    .section-num {
      background: var(--yellow);
      color: #713f12;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .section-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .section-en {
      font-weight: 800;
      font-size: 1rem;
      line-height: 1.2;
    }

    .section-zh {
      font-size: 0.84rem;
      opacity: 0.95;
      font-weight: 600;
    }

    /* =========================================================
       Question Card
    ========================================================= */
    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      border: 2.5px solid #e2e8f0;
      transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .question-card.hidden {
      display: none;
    }

    .question-card.needs-attention {
      border-color: var(--amber);
      animation: shake 0.4s ease;
    }

    .question-card.graded-correct {
      border-color: var(--emerald);
      background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
    }

    .question-card.graded-wrong {
      border-color: var(--red);
      background: linear-gradient(180deg, #ffffff 0%, #fef2f2 100%);
    }

    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .q-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .q-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--emerald-soft);
      color: var(--emerald-dark);
      font-weight: 900;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid #86efac;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 48px;
      padding: 8px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #38bdf8 0%, var(--sky) 100%);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 800;
      box-shadow: 0 4px 0 var(--sky-dark);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--sky-dark);
    }

    .audio-btn.playing {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
      box-shadow: 0 4px 0 #b45309;
      animation: pulseBtn 1s infinite ease-in-out;
    }

    .status-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .status-badge.correct {
      display: inline-flex;
      background: var(--emerald);
      color: #fff;
    }

    .status-badge.wrong {
      display: inline-flex;
      background: var(--red);
      color: #fff;
    }

    /* =========================================================
       Part 1: Two Image Cards Side-by-Side
    ========================================================= */
    .part1-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .img-option-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 10px 8px;
      min-height: 132px;
      width: 100%;
      transition: all 0.18s ease;
    }

    .img-option-btn:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #f0f9ff;
    }

    .img-option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .img-option-btn svg {
      width: 100%;
      max-width: 210px;
      height: auto;
      display: block;
    }

    .img-option-btn .check-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sky);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .img-option-btn.selected {
      border-color: var(--sky);
      background: #e0f2fe;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.22);
    }

    .img-option-btn.selected .check-badge {
      opacity: 1;
      transform: scale(1);
    }

    .img-option-btn.correct-picked {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.22);
    }

    .img-option-btn.correct-picked .check-badge {
      opacity: 1;
      transform: scale(1);
      background: var(--emerald);
    }

    .img-option-btn.wrong-picked {
      border-color: var(--red);
      background: var(--red-soft);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.22);
    }

    .img-option-btn.wrong-picked .check-badge {
      opacity: 1;
      transform: scale(1);
      background: var(--red);
    }

    /* =========================================================
       Part 2: Centered Illustration + a / b Buttons
    ========================================================= */
    .part2-figure {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .part2-figure svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .ab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .ab-btn {
      min-height: 58px;
      border-radius: var(--radius-md);
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .ab-btn:hover:not(:disabled) {
      border-color: #7dd3fc;
      background: #f0f9ff;
    }

    .ab-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .ab-btn.selected {
      border-color: var(--sky);
      background: var(--sky-soft);
      color: var(--sky-dark);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
    }

    .ab-btn.correct-picked {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: var(--emerald-dark);
    }

    .ab-btn.wrong-picked {
      border-color: var(--red);
      background: var(--red-soft);
      color: #b91c1c;
    }

    /* =========================================================
       Part 3: Scene Illustration + Full-Width Sentence Options
    ========================================================= */
    .part3-figure {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .part3-figure svg {
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .sentence-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sentence-btn {
      width: 100%;
      min-height: 56px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      color: var(--text-main);
      font-size: 1.08rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      transition: all 0.18s ease;
    }

    .sentence-btn:hover:not(:disabled) {
      border-color: #7dd3fc;
      background: #f0f9ff;
    }

    .sentence-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .opt-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #334155;
      font-weight: 900;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sentence-btn.selected {
      border-color: var(--sky);
      background: var(--sky-soft);
      color: var(--sky-dark);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
    }

    .sentence-btn.selected .opt-letter {
      background: var(--sky);
      color: #fff;
    }

    .sentence-btn.correct-picked {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: var(--emerald-dark);
    }

    .sentence-btn.correct-picked .opt-letter {
      background: var(--emerald);
      color: #fff;
    }

    .sentence-btn.wrong-picked {
      border-color: var(--red);
      background: var(--red-soft);
      color: #b91c1c;
    }

    .sentence-btn.wrong-picked .opt-letter {
      background: var(--red);
      color: #fff;
    }

    button:disabled {
      cursor: default;
    }

    /* =========================================================
       Submit Bar
    ========================================================= */
    .submit-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-submit {
      width: 100%;
      max-width: 420px;
      min-height: 60px;
      padding: 14px 24px;
      border-radius: 20px;
      background: linear-gradient(180deg, #22c55e 0%, var(--emerald) 100%);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 5px 0 var(--emerald-dark), 0 10px 20px rgba(22, 163, 74, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-submit:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--emerald-dark);
    }

    .btn-submit.hidden {
      display: none;
    }

    /* =========================================================
       Toast Notification (Zero alert())
    ========================================================= */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.warn {
      background: #ea580c;
    }

    /* =========================================================
       Confetti Canvas
    ========================================================= */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 90;
    }

    /* =========================================================
       Animations
    ========================================================= */
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* =========================================================
       Responsive Tweaks
    ========================================================= */
    @media (min-width: 560px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
      }
      .brand-title {
        font-size: 1.15rem;
      }
      .question-card {
        padding: 20px;
      }
      .part1-grid {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Confetti Layer -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Sticky Header -->
  <header class="sticky-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand-title">
          <span class="brand-badge">Unit 2</span>
          <span>Super Star 1 重考練習</span>
        </div>
      </div>
      <div class="header-controls">
        <div id="progressPill" class="progress-pill">已作答 0 / 10 題</div>
        <button id="speedToggleBtn" class="speed-btn" type="button" aria-label="切換語音速度">
          🐢 語速：正常 0.85x
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Retry Mode Banner -->
    <div id="retryBanner" class="retry-banner">
      <span style="font-size: 1.4rem;">🔥</span>
      <span id="retryBannerText">錯題重做模式：把剛剛答錯的題目再聽一次、重新挑戰！</span>
    </div>

    <!-- Result Summary Card (Hidden until submitted) -->
    <section id="resultCard" class="result-card" aria-live="polite">
      <div id="resultEmoji" class="result-emoji">🎉</div>
      <div id="resultScore" class="result-score">100 分</div>
      <div id="resultSubtitle" class="result-subtitle">太棒了！全部答對！</div>
      <div id="resultDetail" class="result-detail"></div>
      <div id="resultActions" class="result-actions"></div>

      <!-- Parent Helper (Collapsed by default, only visible after submission) -->
      <div class="parent-helper-wrap">
        <button id="parentToggleBtn" class="btn-parent-toggle" type="button">
          👀 家長看解答與語音稿
        </button>
        <div id="parentTableBox" class="parent-table-box">
          <table class="parent-table">
            <thead>
              <tr>
                <th>題號</th>
                <th>語音唸法</th>
                <th>正確答案</th>
              </tr>
            </thead>
            <tbody id="parentTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Quiz Sections Container -->
    <div id="quizContainer"></div>

    <!-- Submit Button -->
    <div class="submit-area">
      <button id="submitBtn" class="btn-submit" type="button">
        ✅ 交卷批改
      </button>
    </div>
  </main>

      /* =========================================================
         Web Speech API Voice Setup & Playback
      ========================================================= */
      function pickBestEnglishVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || !voices.length) return null;

        // Prioritize clear en-US voices across iOS / Android / Desktop
        const preferredNames = [
          'Samantha', 'Karen', 'Google US English', 'Aaron', 'Nicky', 'Microsoft Aria', 'Microsoft Jenny'
        ];
        for (const name of preferredNames) {
          const match = voices.find(v => v.name && v.name.includes(name) && v.lang.toLowerCase().startsWith('en'));
          if (match) return match;
        }
        return (
          voices.find(v => v.lang === 'en-US') ||
          voices.find(v => v.lang.toLowerCase().startsWith('en-us')) ||
          voices.find(v => v.lang.toLowerCase().startsWith('en')) ||
          null
        );
      }

      if ('speechSynthesis' in window) {
        selectedVoice = pickBestEnglishVoice();
        window.speechSynthesis.onvoiceschanged = function () {
          selectedVoice = pickBestEnglishVoice();
        };
      }

      function stopAllSpeech() {
        speechSessionId++;
        if (speechTimeout) {
          clearTimeout(speechTimeout);
          speechTimeout = null;
        }
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {
            // Ignore synthesis cancel errors
          }
        }
        if (activeAudioBtn) {
          activeAudioBtn.classList.remove('playing');
          activeAudioBtn.innerHTML = '🔊 播放題目';
          activeAudioBtn = null;
        }
      }

      function playQuestionAudio(question, btnEl) {
        if (!('speechSynthesis' in window)) {
          showToast('此瀏覽器不支援語音播放，請改用手機內建瀏覽器喔！', true);
          return;
        }

        const wasSamePlaying = activeAudioBtn === btnEl;
        stopAllSpeech();
        if (wasSamePlaying) return;

        const currentSession = speechSessionId;
        activeAudioBtn = btnEl;
        btnEl.classList.add('playing');
        btnEl.innerHTML = '🔊 播放中...';

        if (!selectedVoice) {
          selectedVoice = pickBestEnglishVoice();
        }

        const segments = question.speechSegments;

        function speakSegment(index) {
          if (currentSession !== speechSessionId) return;
          if (index >= segments.length) {
            if (activeAudioBtn === btnEl) {
              btnEl.classList.remove('playing');
              btnEl.innerHTML = '🔊 播放題目';
              activeAudioBtn = null;
            }
            return;
          }

          try {
            const utter = new SpeechSynthesisUtterance(segments[index]);
            utter.lang = 'en-US';
            utter.rate = speechRate;
            utter.pitch = 1.02;
            if (selectedVoice) utter.voice = selectedVoice;

            utter.onend = function () {
              if (currentSession !== speechSessionId) return;
              if (index + 1 < segments.length) {
                // ~500ms clear pause between segments (e.g., Part 2 a / b)
                speechTimeout = setTimeout(function () {
                  speakSegment(index + 1);
                }, 520);
              } else {
                speakSegment(index + 1);
              }
            };

            utter.onerror = function () {
              if (currentSession !== speechSessionId) return;
              stopAllSpeech();
            };

            window.speechSynthesis.speak(utter);
          } catch (err) {
            stopAllSpeech();
            showToast('語音播放發生問題，請再按一次試試看！', true);
          }
        }

        // Start first utterance synchronously inside click event for iOS Safari compatibility
        speakSegment(0);
      }

        toastEl.textContent = message;

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2800);
      }

      /* =========================================================
         Selection & UI Updates
      ========================================================= */
      function selectAnswer(qId, val) {
        userAnswers[qId] = val;

        const card = document.getElementById('q-card-' + qId);
        card.classList.remove('needs-attention');

        const buttons = card.querySelectorAll('[data-qid]');
        buttons.forEach(function (btn) {
          if (btn.getAttribute('data-val') === val) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });

        updateProgressPill();
      }

      function updateProgressPill() {
        const totalActive = activeQuestionIds.length;
        const answeredCount = activeQuestionIds.filter(id => Boolean(userAnswers[id])).length;

        if (isRetryMode) {
          const remaining = totalActive - answeredCount;
          progressPill.classList.add('retry-mode');
          progressPill.textContent = remaining > 0
            ? `錯題重做模式：剩餘 ${remaining} 題`
            : `錯題重做模式：已選完 ${totalActive} 題`;
        } else {
          progressPill.classList.remove('retry-mode');
          progressPill.textContent = `已作答 ${answeredCount} / ${totalActive} 題`;
        }
      }

      function updateVisibilityAndProgress() {
        // Show only active questions
        QUESTIONS.forEach(function (q) {
          const card = document.getElementById('q-card-' + q.id);
          const isActive = activeQuestionIds.includes(q.id);
          card.classList.toggle('hidden', !isActive);
        });

        // Hide section headers if none of their questions are active
        SECTIONS.forEach(function (sec) {
          const secEl = document.getElementById('section-' + sec.id);
          const hasActive = QUESTIONS.some(q => q.section === sec.id && activeQuestionIds.includes(q.id));
          secEl.classList.toggle('hidden', !hasActive);
        });

        if (isRetryMode) {
          retryBanner.classList.add('visible');
          retryBannerText.textContent = `錯題重做模式：只剩下 ${activeQuestionIds.length} 題，仔細再聽一次喔！`;
        } else {
          retryBanner.classList.remove('visible');
        }

        updateProgressPill();
      }

      /* =========================================================
         Deferred Grading ("交卷批改")
      ========================================================= */
      function handleSubmit() {
        stopAllSpeech();

        // Check for unanswered active questions
        const unansweredIds = activeQuestionIds.filter(id => !userAnswers[id]);
        if (unansweredIds.length > 0) {
          const firstMissing = unansweredIds[0];
          const missingText = unansweredIds.length <= 3
            ? `還有第 ${unansweredIds.join('、')} 題還沒選喔！`
            : `還有第 ${firstMissing} 題等 ${unansweredIds.length} 題還沒選喔！`;
          showToast(missingText, true);

          const targetCard = document.getElementById('q-card-' + firstMissing);
          if (targetCard) {
            targetCard.classList.remove('needs-attention');
            void targetCard.offsetWidth; // restart animation
            targetCard.classList.add('needs-attention');
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          return;
        }

        isSubmitted = true;
        submitBtn.classList.add('hidden');

        let roundCorrect = 0;
        const wrongIdsThisRound = [];

        activeQuestionIds.forEach(function (qId) {
          const q = QUESTIONS.find(item => item.id === qId);
          const picked = userAnswers[qId];
          const isCorrect = picked === q.correct;

          const card = document.getElementById('q-card-' + qId);
          const badge = document.getElementById('status-badge-' + qId);
          const buttons = card.querySelectorAll('[data-qid]');

          card.classList.remove('graded-correct', 'graded-wrong');
          badge.className = 'status-badge';

          if (isCorrect) {
            roundCorrect++;
            masteredIds.add(qId);
            card.classList.add('graded-correct');
            badge.classList.add('correct');
            badge.textContent = '✓ 答對';
          } else {
            wrongIdsThisRound.push(qId);
            card.classList.add('graded-wrong');
            badge.classList.add('wrong');
            badge.textContent = '✗ 答錯';
          }

          // Lock buttons & style chosen answer ONLY (do not spoil correct answer on wrong ones)
          buttons.forEach(function (btn) {
            btn.disabled = true;
            btn.classList.remove('selected', 'correct-picked', 'wrong-picked');
            const val = btn.getAttribute('data-val');
            if (val === picked) {
              btn.classList.add(isCorrect ? 'correct-picked' : 'wrong-picked');
              const checkBadge = btn.querySelector('.check-badge');
              if (checkBadge) checkBadge.textContent = isCorrect ? '✓' : '✗';
            }
          });
        });

        renderResultSummary(roundCorrect, wrongIdsThisRound);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderResultSummary(roundCorrect, wrongIds) {
        const allMastered = wrongIds.length === 0 && masteredIds.size === QUESTIONS.length;
        const totalRound = activeQuestionIds.length;

        resultCard.classList.add('visible');
        resultCard.classList.toggle('has-errors', wrongIds.length > 0);

        // Collapse parent helper by default on every new grade
        parentTableBox.classList.remove('open');
        parentToggleBtn.textContent = '👀 家長看解答與語音稿';

        if (!isRetryMode) {
          const score = roundCorrect * 10;
          resultScore.textContent = `${score} 分`;
          if (allMastered) {
            resultEmoji.textContent = '🏆';
            resultSubtitle.textContent = '太厲害了！滿分 100 分！';
            resultDetail.textContent = '10 題全部答對，Unit 2 已經完全學會囉！';
            launchConfetti();
          } else if (score >= 80) {
            resultEmoji.textContent = '🌟';
            resultSubtitle.textContent = `表現很棒！答對 ${roundCorrect} / 10 題`;
            resultDetail.textContent = `還有 ${wrongIds.length} 題答錯（第 ${wrongIds.join('、')} 題），再挑戰一次就滿分了！`;
          } else {
            resultEmoji.textContent = '💪';
            resultSubtitle.textContent = `答對 ${roundCorrect} / 10 題，加油！`;
            resultDetail.textContent = `第 ${wrongIds.join('、')} 題再聽一次語音，重新練習一定會更棒！`;
          }
        } else {
          if (allMastered) {
            resultEmoji.textContent = '🎉';
            resultScore.textContent = '全部過關！';
            resultSubtitle.textContent = `這次重做的 ${totalRound} 題全部答對了！`;
            resultDetail.textContent = '總進度：10 / 10 題全部掌握，太棒了！';
            launchConfetti();
          } else {
            resultEmoji.textContent = '🔥';
            resultScore.textContent = `改對 ${roundCorrect} / ${totalRound} 題`;
            resultSubtitle.textContent = `總進度：已掌握 ${masteredIds.size} / 10 題`;
            resultDetail.textContent = `還有第 ${wrongIds.join('、')} 題還沒答對，我們再試一次！`;
          }
        }

        // Action Buttons
        resultActions.innerHTML = '';
        if (wrongIds.length > 0) {
          const retryBtn = document.createElement('button');
          retryBtn.type = 'button';
          retryBtn.className = 'btn-retry-wrong';
          retryBtn.textContent = `🔄 只重做錯的題（${wrongIds.length} 題）`;
          retryBtn.addEventListener('click', function () {
            startRetryWrong(wrongIds);
          });
          resultActions.appendChild(retryBtn);
        }

        const restartBtn = document.createElement('button');
        restartBtn.type = 'button';
        restartBtn.className = 'btn-restart-all';
        restartBtn.textContent = '重新考全部 10 題';
        restartBtn.addEventListener('click', resetFullQuiz);
        resultActions.appendChild(restartBtn);
      }

      /* =========================================================
         Retry Wrong Questions Only / Full Reset
      ========================================================= */
      function unlockQuestionCards(ids) {
        ids.forEach(function (qId) {
          delete userAnswers[qId];
          const card = document.getElementById('q-card-' + qId);
          const badge = document.getElementById('status-badge-' + qId);
          const buttons = card.querySelectorAll('[data-qid]');

          card.classList.remove('graded-correct', 'graded-wrong', 'needs-attention');
          badge.className = 'status-badge';
          badge.textContent = '';

          buttons.forEach(function (btn) {
            btn.disabled = false;
            btn.classList.remove('selected', 'correct-picked', 'wrong-picked');
            const checkBadge = btn.querySelector('.check-badge');
            if (checkBadge) checkBadge.textContent = '✓';
          });
        });
      }

      function startRetryWrong(wrongIds) {
        stopAllSpeech();
        isRetryMode = true;
        isSubmitted = false;
        activeQuestionIds = [...wrongIds];

        unlockQuestionCards(activeQuestionIds);
        resultCard.classList.remove('visible');
        submitBtn.classList.remove('hidden');
        submitBtn.textContent = '✅ 交卷批改錯題';

        updateVisibilityAndProgress();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`進入錯題重做模式，共 ${wrongIds.length} 題！`, false);
      }

      function resetFullQuiz() {
        stopAllSpeech();
        isRetryMode = false;
        isSubmitted = false;
        masteredIds.clear();
        userAnswers = {};
        activeQuestionIds = QUESTIONS.map(q => q.id);

        unlockQuestionCards(activeQuestionIds);
        resultCard.classList.remove('visible');
        submitBtn.classList.remove('hidden');
        submitBtn.textContent = '✅ 交卷批改';

        updateVisibilityAndProgress();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      /* =========================================================
         Lightweight Confetti Celebration
      ========================================================= */
      function launchConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#16a34a', '#facc15', '#0ea5e9', '#f472b6', '#fb923c', '#a855f7'];
        const pieces = [];
        for (let i = 0; i < 95; i++) {
          pieces.push({
            x: Math.random() * canvas.width,
            y: -20 - Math.random() * canvas.height * 0.4,
            w: 7 + Math.random() * 7,
            h: 6 + Math.random() * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            vy: 2.8 + Math.random() * 4.2,
            vx: (Math.random() - 0.5) * 3,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2
          });
        }

        let frame = 0;
        function animate() {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          let alive = false;
          for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;
            if (p.y < canvas.height + 20) alive = true;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }

          if (alive && frame < 180) {
            requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }
        requestAnimationFrame(animate);
      }

      /* =========================================================
         Event Listeners & Init
      ========================================================= */
      speedToggleBtn.addEventListener('click', function () {
        if (speechRate === 0.85) {
          speechRate = 0.65;
          speedToggleBtn.classList.add('slow');
          speedToggleBtn.textContent = '🐢 語速：慢速 0.65x';
          showToast('已切換成慢速語音（0.65x）', false);
        } else {
          speechRate = 0.85;
          speedToggleBtn.classList.remove('slow');
          speedToggleBtn.textContent = '🔊 語速：正常 0.85x';
          showToast('已切換成正常語音（0.85x）', false);
        }
      });

      submitBtn.addEventListener('click', handleSubmit);

      parentToggleBtn.addEventListener('click', function () {
        const isOpen = parentTableBox.classList.toggle('open');
        parentToggleBtn.textContent = isOpen ? '🙈 收起解答與語音稿' : '👀 家長看解答與語音稿';
      });

      window.addEventListener('beforeunload', stopAllSpeech);

      // Initialize UI
      speedToggleBtn.textContent = '🔊 語速：正常 0.85x';
      renderQuiz();
    })();
  </script>
</body>
</html>
